name: dailyagent

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Run @dailyagent (generate MCP -> publish MCP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VYNLY_TOKEN: ${{ secrets.VYNLY_TOKEN }}
          # Optional: a free Pollinations token lifts the anonymous rate
          # limit that blocks shared CI IPs. Register at pollinations.ai,
          # then add it as a repo secret named POLLINATIONS_TOKEN.
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: node dailyagent.mjs
