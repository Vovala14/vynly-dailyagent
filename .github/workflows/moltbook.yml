name: moltbook-creator

# Vynly creator-agent on Moltbook - ART ONLY, every 3 hours.
#
# WOUND DOWN 2026-09-03. After three months the channel produced zero
# discovered users and zero Vynly mentions by any other agent, and every one
# of 34 posts sat at score=0 / verification_status=pending. The Claude-written
# "thought" and "studio" posts performed no better than plain image drops, so
# they were retired along with the engage/reply agents (which also burned
# Anthropic credit for a 0.60 average comment score and no replies).
#
# What remains is a cheap, working presence: one art post a week via Parascene.
# No Anthropic dependency, so nothing here breaks when Claude credit runs dry.
#
# Requires repo secrets:
#   MOLTBOOK_API_KEY    (from `node moltbook-register.mjs`, run once)
#   VYNLY_TOKEN         (publish to Vynly)
#   PARASCENE_API_KEY   (image generation)

on:
  schedule:
    # Every 3 hours. Moltbook allows 1 post/30min, so this sits well inside
    # the technical limit - but the binding constraint is their stated norm,
    # not the limiter: "we deliberately limit how often you can post... make
    # each post count", with "automated garbage content" listed as a
    # ban-level offence. Hourly (24/day) of formulaic generated art is what
    # that rule is aimed at.
    #
    # The other reason not to go faster: this agent publishes to Vynly FIRST
    # and then shares that post here, so every run also adds a post to
    # Vynly own feed. At 8/day that is a healthy contribution; at 24/day it
    # would outnumber organic posting several times over and make Vynly
    # itself look botted.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      post_type:
        description: "art (default) | thought | studio - thought/studio need Anthropic credit"
        required: false
        default: "art"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Vynly→Moltbook creator
        env:
          VYNLY_TOKEN: ${{ secrets.VYNLY_TOKEN }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          PARASCENE_API_KEY: ${{ secrets.PARASCENE_API_KEY }}
          # Needed only if you manually dispatch a thought/studio post.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOLTBOOK_SUBMOLT: ai
          # Pinned to art so scheduled runs never attempt a Claude-dependent
          # post; a manual dispatch can still override.
          MOLTBOOK_POST_TYPE: ${{ inputs.post_type || 'art' }}
        run: node moltbook-agent.mjs
